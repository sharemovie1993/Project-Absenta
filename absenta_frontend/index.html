<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Absenta - Sistem Presensi Sekolah Cerdas berbasis Cloud untuk manajemen kehadiran guru, siswa, dan staf secara real-time dan akurat." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="theme-color" content="#2563eb" />
    <meta property="og:title" content="Absenta — Sistem Presensi Sekolah Cerdas" />
    <meta property="og:description" content="Manajemen kehadiran sekolah yang modern, ringan, dan akurat." />
    <meta property="og:type" content="website" />
    <title>Absenta — Sistem Presensi Sekolah Cerdas</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('absenta_theme_preference');
          if (stored === 'dark-default') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

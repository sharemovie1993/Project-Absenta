<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Absenta - Sistem Presensi Sekolah Cerdas berbasis Cloud untuk manajemen kehadiran guru, siswa, dan staf secara real-time dan akurat." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;600;800&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    </noscript>
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="theme-color" content="#2563eb" />
    <meta property="og:title" content="Absenta — Sistem Presensi Sekolah Cerdas" />
    <meta property="og:description" content="Manajemen kehadiran sekolah yang modern, ringan, dan akurat." />
    <meta property="og:type" content="website" />
    <title>Absenta — Sistem Presensi Sekolah Cerdas</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('absenta_theme_preference');
          if (stored === 'dark-default') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-shell" style="min-height: 100vh; background-color: #f8fafc; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <style>
          @keyframes abs-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
          .sh-pulse { animation: abs-pulse 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
          @media (prefers-color-scheme: dark) {
            #app-shell { background-color: #020617 !important; }
            .sh-bar { background-color: #0f172a !important; border-color: #1e293b !important; }
            .sh-box { background-color: #1e293b !important; }
            .sh-card { background-color: #0f172a !important; border-color: #1e293b !important; }
          }
          [data-theme='dark'] #app-shell { background-color: #020617 !important; }
          [data-theme='dark'] .sh-bar { background-color: #0f172a !important; border-color: #1e293b !important; }
          [data-theme='dark'] .sh-box { background-color: #1e293b !important; }
          [data-theme='dark'] .sh-card { background-color: #0f172a !important; border-color: #1e293b !important; }
        </style>
        <header class="sh-bar" style="height: 56px; background-color: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div class="sh-box sh-pulse" style="width: 32px; height: 32px; border-radius: 8px; background-color: #e2e8f0;"></div>
            <div class="sh-box sh-pulse" style="width: 110px; height: 16px; border-radius: 6px; background-color: #e2e8f0;"></div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div class="sh-box sh-pulse" style="width: 28px; height: 28px; border-radius: 50%; background-color: #e2e8f0;"></div>
            <div class="sh-box sh-pulse" style="width: 28px; height: 28px; border-radius: 50%; background-color: #e2e8f0;"></div>
          </div>
        </header>
        <main style="padding: 16px; max-width: 1280px; margin: 0 auto;">
          <div class="sh-card sh-pulse" style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px; margin-bottom: 16px;">
            <div class="sh-box" style="width: 150px; height: 20px; border-radius: 6px; background-color: #e2e8f0; margin-bottom: 8px;"></div>
            <div class="sh-box" style="width: 230px; height: 12px; border-radius: 4px; background-color: #f1f5f9;"></div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
            <div class="sh-card sh-pulse" style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; height: 88px;">
              <div class="sh-box" style="width: 50%; height: 12px; border-radius: 4px; background-color: #e2e8f0; margin-bottom: 12px;"></div>
              <div class="sh-box" style="width: 70%; height: 20px; border-radius: 6px; background-color: #cbd5e1;"></div>
            </div>
            <div class="sh-card sh-pulse" style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; height: 88px;">
              <div class="sh-box" style="width: 50%; height: 12px; border-radius: 4px; background-color: #e2e8f0; margin-bottom: 12px;"></div>
              <div class="sh-box" style="width: 70%; height: 20px; border-radius: 6px; background-color: #cbd5e1;"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

upstream absenta_backend_upstream {
  least_conn;
    server 10.50.0.2:3000 max_fails=3 fail_timeout=30s down;
    server 10.50.0.3:3000 max_fails=3 fail_timeout=30s down;
    server 10.50.0.4:3001 max_fails=3 fail_timeout=30s;

  keepalive 64;
}

upstream absenta_frontend_upstream {
  least_conn;
    server 10.50.0.2:8080 max_fails=3 fail_timeout=30s down;
    server 10.50.0.3:8080 max_fails=3 fail_timeout=30s down;
    server 10.50.0.4:8080 max_fails=3 fail_timeout=30s;

  keepalive 64;
}

server {
  listen 80;
  server_name api.absenta.id;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.absenta.id;

  ssl_certificate /etc/letsencrypt/live/absenta.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/absenta.id/privkey.pem;

  location / {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' "$http_origin" always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'authorization, content-type, x-tenant-sub, x-tenant-host, x-tenant-domain, x-tenant-id, x-skip-tenant, x-skip-403-redirect, x-requested-with, accept, origin, user-agent, x-socket-id' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Max-Age' 86400 always;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    add_header 'Access-Control-Allow-Origin' "$http_origin" always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'authorization, content-type, x-tenant-sub, x-tenant-host, x-tenant-domain, x-tenant-id, x-skip-tenant, x-skip-403-redirect, x-requested-with, accept, origin, user-agent, x-socket-id' always;

    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Credentials';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';

    proxy_pass http://absenta_backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Tenant-Subdomain $tenant_subdomain;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
  }
}

server {
  listen 80;
  server_name *.absenta.id absenta.id;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name *.absenta.id absenta.id;

  ssl_certificate /etc/letsencrypt/live/absenta.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/absenta.id/privkey.pem;

  location ^~ /webhooks/ {
    proxy_pass http://absenta_backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Tenant-Subdomain $tenant_subdomain;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /payment/ {
    proxy_pass http://absenta_backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Tenant-Subdomain $tenant_subdomain;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /invoice/public/ {
    proxy_pass http://absenta_frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Tenant-Subdomain $tenant_subdomain;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serve static assets explicitly to frontend upstream to avoid SPA fallbacks returning HTML
  location ^~ /assets/ {
    proxy_pass http://absenta_frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~* \.(js|css|map|svg|png|jpe?g|webp|woff2?)$ {
    proxy_pass http://absenta_frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location /api/ {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' "$http_origin" always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'authorization, content-type, x-tenant-sub, x-tenant-host, x-tenant-domain, x-tenant-id, x-skip-tenant, x-skip-403-redirect, x-requested-with, accept, origin, user-agent, x-socket-id' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Max-Age' 86400 always;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    add_header 'Access-Control-Allow-Origin' "$http_origin" always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'authorization, content-type, x-tenant-sub, x-tenant-host, x-tenant-domain, x-tenant-id, x-skip-tenant, x-skip-403-redirect, x-requested-with, accept, origin, user-agent, x-socket-id' always;

    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Credentials';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';

    proxy_pass http://absenta_backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Tenant-Subdomain $tenant_subdomain;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
  }

  location /socket.io/ {
    proxy_pass http://absenta_backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Tenant-Subdomain $tenant_subdomain;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  location / {
    proxy_pass http://absenta_frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Tenant-Subdomain $tenant_subdomain;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 404 = /index.html;
  }
}
